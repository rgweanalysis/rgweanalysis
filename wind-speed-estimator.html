<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind Speed Estimator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.09);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      display: block;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 115px;
      gap: 10px;
    }

    input, select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px;
      font-size: 17px;
      outline: none;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: #111827;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    .result {
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      background: #f3f4f6;
      text-align: center;
    }

    .result .value {
      font-size: 34px;
      font-weight: 800;
      margin-top: 6px;
    }

    .error {
      background: #fff1f2;
      color: #9f1239;
    }
  

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      text-align: center;
    }

    .loading {
      opacity: 0.75;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

  </style>
</head>

    </div>

    <label for="production">Daily Production</label>

    <div class="row">
      <input id="production" type="number" step="any" placeholder="Enter production" />
      <select id="unit">
        <option value="MWh">MWh</option>
        <option value="kWh">kWh</option>
        <option value="GWh">GWh</option>
      </select>
    </div>

    <button id="calculateBtn" type="button">Calculate Average Wind Speed</button>

    <div id="result" class="result">
      <div>Average Wind Speed During the Day</div>
      <div class="value">—</div>
    </div>

    <div class="hint">Frontend only sends production/unit to the secured Cloudflare Worker. Calibration data is not stored in this file.</div>
  </main>

  <script>
    // 1) Deploy backend-worker.js to Cloudflare Workers.
    // 2) Replace the URL below with your Worker endpoint.
    const API_URL = "https://wind-speed-api.mohamedlasheen2019.workers.dev/estimate";

    const productionInput = document.getElementById("production");
    const unitInput = document.getElementById("unit");
    const resultBox = document.getElementById("result");
    const labelBox = resultBox.firstElementChild;
    const valueBox = resultBox.querySelector(".value");
    const calculateBtn = document.getElementById("calculateBtn");

    let debounceTimer;

    function setResult(label, value, isError = false) {
      resultBox.classList.toggle("error", isError);
      labelBox.textContent = label;
      valueBox.textContent = value;
    }

    function isConfigured() {
      return !API_URL.includes("YOUR-WORKER-SUBDOMAIN");
    }

    async function calculateWindSpeed() {
      const rawValue = Number(productionInput.value);
      const unit = unitInput.value;

      if (!Number.isFinite(rawValue) || rawValue <= 0) {
        setResult("Enter a valid production value", "—", true);
        return;
      }

      if (!isConfigured()) {
        setResult("Set your Cloudflare Worker API URL first", "—", true);
        return;
      }

      calculateBtn.disabled = true;
      resultBox.classList.add("loading");
      setResult("Calculating...", "—", false);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ production: rawValue, unit })
        });

        const data = await response.json().catch(() => null);

        if (!response.ok || !data || typeof data.windSpeed !== "number") {
          const message = data?.error || "Unable to calculate wind speed";
          setResult(message, "—", true);
          return;
        }

        setResult("Average Wind Speed During the Day", data.windSpeed.toFixed(2) + " m/s", false);
      } catch (error) {
        setResult("Backend connection failed", "—", true);
      } finally {
        calculateBtn.disabled = false;
        resultBox.classList.remove("loading");
      }
    }

    function calculateWithDebounce() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(calculateWindSpeed, 350);
    }

    calculateBtn.addEventListener("click", calculateWindSpeed);
    productionInput.addEventListener("input", calculateWithDebounce);
    unitInput.addEventListener("change", calculateWindSpeed);
  </script>
